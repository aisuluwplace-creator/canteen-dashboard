<head>

<style>
  :root{
    --bg:#eef1f6; --surface:#ffffff; --border:rgba(20,27,46,0.10);
    --ink:#141b2e; --ink-2:#4a5573; --ink-muted:#8891a8;
    --navy:#1b2a63; --navy-deep:#101a42; --sky:#5f86dd;
    --current:#1b2a63; --compare:#8facea;
    --good:#1f9d55; --critical:#d9503d; --muted:#c7cbd6;
    --shadow:0 1px 2px rgba(16,26,66,0.05), 0 10px 24px -14px rgba(16,26,66,0.22);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:1220px; margin:0 auto; padding:14px 20px 60px; }
  h1,h2,h3{ font-family:"Manrope", system-ui, sans-serif; margin:0; }

  .lang-row{ display:flex; justify-content:flex-end; gap:6px; padding:6px 0 10px; flex-wrap:wrap; }
  .lang-btn{
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:6px 12px; font-size:12.5px; font-weight:600; color:var(--ink-2); cursor:pointer;
  }
  .lang-btn.active{ background:var(--navy); color:#fff; border-color:var(--navy); }

  .hero{
    background:linear-gradient(135deg,var(--navy-deep) 0%,var(--navy) 62%,#2c418f 100%);
    padding:26px 36px 24px; border-radius:20px; margin-bottom:20px;
    box-shadow:0 14px 30px -18px rgba(16,26,66,0.55);
  }
  .hero .kicker{ font-size:11px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--sky); margin-bottom:8px; }
  .hero-title{ display:flex; align-items:center; gap:14px; }
  .hero-title .tri{ width:0; height:0; flex:none; border-top:14px solid transparent; border-bottom:14px solid transparent; }
  .hero-title .tri.l{ border-left:18px solid var(--sky); }
  .hero-title .tri.r{ border-right:18px solid var(--sky); opacity:.55; }
  .hero-title h1{ color:#fff; font-size:30px; font-weight:800; letter-spacing:-0.01em; }
  .hero .sub{ color:#c7d3f4; font-size:13px; margin-top:8px; max-width:60ch; }

  .tabs{ display:flex; gap:6px; border-bottom:1px solid var(--border); margin-bottom:18px; flex-wrap:wrap; }
  .tab-btn{
    background:var(--surface); border:1px solid var(--border); border-bottom:none;
    border-radius:10px 10px 0 0; padding:10px 18px; font-weight:700; font-size:13.5px;
    color:var(--ink-2); cursor:pointer; margin-bottom:-1px;
  }
  .tab-btn.active{ color:var(--navy); border-color:var(--border); background:var(--surface); box-shadow:0 -2px 0 var(--navy) inset; }

  .filters{ display:flex; gap:22px; flex-wrap:wrap; margin-bottom:18px; }
  .filter-block{ min-width:220px; flex:1; }
  .filter-block .flabel{ font-size:12px; font-weight:600; color:var(--ink-2); margin-bottom:6px; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{
    background:var(--surface); border:1px solid var(--border); border-radius:999px;
    padding:6px 12px; font-size:12px; color:var(--ink-2); cursor:pointer; user-select:none;
  }
  .chip.sel-cur{ background:var(--current); border-color:var(--current); color:#fff; }
  .chip.sel-cmp{ background:var(--compare); border-color:var(--compare); color:#0e1b40; }
  .chip.sel-seg{ background:var(--navy); border-color:var(--navy); color:#fff; }

  .kpi-row{ display:grid; grid-template-columns:repeat(4,minmax(150px,1fr)); gap:14px; margin-bottom:10px; }
  @media (max-width:900px){ .kpi-row{ grid-template-columns:repeat(2,1fr); } .filters{ gap:14px; } }
  .kpi-card{
    background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--navy); border-radius:12px;
    box-shadow:var(--shadow); padding:16px 18px 14px; display:flex; flex-direction:column; gap:8px; min-width:0;
  }
  .kpi-card.good{ border-left-color:var(--good); }
  .kpi-card.flag{ border-left-color:var(--critical); }
  .kpi-card.compare{ border-left-color:var(--compare); }
  .kpi-card .klabel{ font-size:11px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:var(--ink-muted); min-height:28px; }
  .kpi-card .kvalue{ font-family:"Manrope",sans-serif; font-size:27px; font-weight:800; }
  .kpi-card .kvalue small{ font-size:13px; font-weight:600; color:var(--ink-muted); margin-left:2px; }
  .kpi-card.flag .kvalue{ color:var(--critical); }
  .kpi-card.good .kvalue{ color:var(--good); }
  .kpi-card.compare .kvalue{ color:var(--compare); }
  .kpi-card .kfoot{ font-size:11.5px; color:var(--ink-muted); }

  .legend-pill{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-2); margin-right:18px; }
  .legend-pill .sw{ width:11px; height:11px; border-radius:3px; }

  .sec-head{ display:flex; align-items:baseline; gap:10px; margin:22px 0 4px; }
  .sec-head .bar{ width:5px; height:19px; border-radius:3px; background:var(--navy); flex:none; }
  .sec-head h2{ font-size:17.5px; font-weight:800; }
  .sec-note{ font-size:12.5px; color:var(--ink-muted); margin:2px 0 14px 15px; }
  .lang-note{ font-size:11.5px; color:var(--ink-muted); margin:-6px 0 12px 15px; font-style:italic; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); padding:16px 18px; }
  .q-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:800px){ .q-grid{ grid-template-columns:1fr; } }
  .q-card h3{ font-size:14px; font-weight:700; margin-bottom:8px; }
  .q-caption{ font-size:11.5px; color:var(--ink-muted); margin-top:8px; }

  .bar-svg text{ font-family:"Public Sans",sans-serif; }
  .hitbar{ cursor:pointer; }
  .tip{
    position:fixed; pointer-events:none; z-index:50; background:var(--ink); color:#fff;
    font-size:12px; padding:6px 10px; border-radius:7px; box-shadow:var(--shadow);
    opacity:0; transform:translateY(4px); transition:opacity .1s, transform .1s; max-width:240px;
  }
  .tip.show{ opacity:1; transform:translateY(0); }

  .comments-grid{ display:grid; grid-template-columns:1fr 1.4fr; gap:16px; }
  @media (max-width:800px){ .comments-grid{ grid-template-columns:1fr; } }
  .sent-tabs{ display:flex; gap:6px; margin:10px 0 12px; flex-wrap:wrap; }
  .sent-tab{
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:6px 12px; font-size:12.5px; font-weight:600; color:var(--ink-2); cursor:pointer;
  }
  .sent-tab.active{ background:var(--navy); color:#fff; border-color:var(--navy); }
  .quote-card{
    background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--navy);
    border-radius:8px; padding:12px 16px; margin-bottom:9px; font-style:italic; font-size:13px;
    line-height:1.5; color:var(--ink-2); box-shadow:var(--shadow);
  }
  .quote-card.pos{ border-left-color:var(--good); }
  .quote-card.neg{ border-left-color:var(--critical); }
  .quote-card::before{ content:"\201C"; font-style:normal; font-weight:800; color:var(--navy); margin-right:2px; }
  .empty-note{ font-size:12.5px; color:var(--ink-muted); }

  hr{ border:none; border-top:1px solid var(--border); margin:26px 0 20px; }
  .foot-note{ font-size:11px; color:var(--ink-muted); line-height:1.6; }
</style>
</head>

</div>

const LANGS = [["ru","RU · Русский"],["kz","ҚАЗ · Қазақша"],["en","EN · English"]];

const state = { lang: "ru", survey: "canteen", sel: {}, sentTab: {} };
for (const key of SURVEY_ORDER){
  const sv = DATA.surveys[key];
  if (!sv) continue;
  const periods = [...new Set(sv.records.map(r=>r.period))].sort();
  const counts = {};
  periods.forEach(p => counts[p] = sv.records.filter(r=>r.period===p).length);
  const busiest = [...periods].sort((a,b)=>counts[b]-counts[a]).slice(0,2).sort();
  let cur = [], cmp = [];
  if (busiest.length === 2){ cmp = [busiest[0]]; cur = [busiest[1]]; }
  else if (busiest.length === 1){ cur = [busiest[0]]; }
  state.sel[key] = { cur, cmp, seg: [] };
  state.sentTab[key] = "pos";
}

function fmtPeriod(p, lang){
  const [y,m] = p.split("-").map(Number);
  return `${MONTHS[lang][m]} ${y}`;
}

// ---------------------------------------------------------------- tooltip --
const tipEl = document.getElementById("tip");
function showTip(evt, html){
  tipEl.innerHTML = html; tipEl.classList.add("show");
  let x = evt.clientX + 14, y = evt.clientY + 14;
  const r = tipEl.getBoundingClientRect();
  if (x + r.width > window.innerWidth - 8) x = evt.clientX - r.width - 14;
  if (y + r.height > window.innerHeight - 8) y = evt.clientY - r.height - 14;
  tipEl.style.left = x+"px"; tipEl.style.top = y+"px";
}
function hideTip(){ tipEl.classList.remove("show"); }

// ------------------------------------------------------------ chart: bars --
function groupedBarSVG(cats, curVals, cmpVals, opts){
  opts = opts || {};
  const W = opts.width || 460, H = opts.height || 190;
  const padL = 30, padR = 8, padT = 10, padB = 24;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const maxV = Math.max(1, ...curVals, ...cmpVals);
  const n = cats.length;
  const groupW = plotW / n;
  const barW = Math.min(20, groupW * 0.34);
  let bars = "";
  const gridLines = [0, 0.5, 1].map(f => {
    const y = padT + plotH * (1-f);
    return `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="rgba(20,27,46,0.08)" stroke-width="1"/>
            <text x="${padL-6}" y="${y+3}" font-size="9" fill="#8891a8" text-anchor="end">${Math.round(maxV*f)}%</text>`;
  }).join("");
  for (let i=0;i<n;i++){
    const gx = padL + groupW*i + groupW/2;
    const cmpH = plotH * (cmpVals[i]/maxV);
    const curH = plotH * (curVals[i]/maxV);
    const cmpX = gx - barW - 2, curX = gx + 2;
    bars += `<rect class="hitbar" data-i="${i}" data-s="cmp" x="${cmpX}" y="${padT+plotH-cmpH}" width="${barW}" height="${Math.max(cmpH,1)}" rx="3" fill="var(--compare)"/>`;
    bars += `<rect class="hitbar" data-i="${i}" data-s="cur" x="${curX}" y="${padT+plotH-curH}" width="${barW}" height="${Math.max(curH,1)}" rx="3" fill="var(--current)"/>`;
    bars += `<text x="${gx}" y="${H-6}" font-size="10" fill="#4a5573" text-anchor="middle">${cats[i]}</text>`;
  }
  return `<svg class="bar-svg" viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">${gridLines}${bars}</svg>`;
}

function wireBarTooltips(container, cats, curVals, cmpVals, curLabel, cmpLabel){
  container.querySelectorAll(".hitbar").forEach(el => {
    el.addEventListener("pointermove", evt => {
      const i = +el.dataset.i, s = el.dataset.s;
      const v = s === "cur" ? curVals[i] : cmpVals[i];
      const label = s === "cur" ? curLabel : cmpLabel;
      showTip(evt, `<b>${v}%</b> — ${label}<br>${cats[i]}`);
    });
    el.addEventListener("pointerleave", hideTip);
  });
}

function trendBarSVG(periods, counts, colors, lang){
  const W = 900, H = 190, padL = 10, padR = 10, padT = 22, padB = 26;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const maxV = Math.max(1, ...counts);
  const n = periods.length;
  const slot = plotW / n;
  const barW = Math.min(46, slot * 0.6);
  let bars = "";
  for (let i=0;i<n;i++){
    const h = plotH * (counts[i]/maxV);
    const x = padL + slot*i + slot/2 - barW/2;
    const y = padT + plotH - h;
    bars += `<rect class="hitbar" data-i="${i}" x="${x}" y="${y}" width="${barW}" height="${Math.max(h,1)}" rx="4" fill="${colors[i]}"/>`;
    bars += `<text x="${x+barW/2}" y="${y-6}" font-size="10" fill="#4a5573" text-anchor="middle">${counts[i]}</text>`;
    bars += `<text x="${x+barW/2}" y="${H-8}" font-size="9.5" fill="#8891a8" text-anchor="middle">${fmtPeriod(periods[i],lang)}</text>`;
  }
  return `<svg class="bar-svg" viewBox="0 0 ${W} ${H}" width="100%">${bars}</svg>`;
}

// -------------------------------------------------------------- rendering --
function renderLangRow(){
  const el = document.getElementById("langRow");
  el.innerHTML = LANGS.map(([code,label]) =>
    `<button class="lang-btn ${state.lang===code?'active':''}" data-lang="${code}">${label}</button>`
  ).join("");
  el.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    state.lang = b.dataset.lang; renderAll();
  }));
}

function renderHero(){
  document.getElementById("heroKicker").textContent = tr("hero_kicker", state.lang);
  document.getElementById("heroTitle").textContent = tr("hero_title", state.lang);
  document.getElementById("heroSub").textContent = tr("hero_sub", state.lang);
  document.getElementById("footNote").textContent = tr("footer_note", state.lang);
}

function renderTabs(){
  const el = document.getElementById("tabsRow");
  el.innerHTML = SURVEY_ORDER.filter(k=>DATA.surveys[k]).map(key => {
    const sv = DATA.surveys[key];
    return `<button class="tab-btn ${state.survey===key?'active':''}" data-key="${key}">${sv.icon} ${L(sv.title, state.lang)}</button>`;
  }).join("");
  el.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    state.survey = b.dataset.key; renderSurvey();
  }));
}

function toggle(arr, val){
  const i = arr.indexOf(val);
  if (i >= 0) arr.splice(i,1); else arr.push(val);
}

function renderSurvey(){
  const key = state.survey;
  const sv = DATA.surveys[key];
  const root = document.getElementById("surveyRoot");
  if (!sv){ root.innerHTML = ""; return; }
  const lang = state.lang;
  const sel = state.sel[key];

  const periods = [...new Set(sv.records.map(r=>r.period))].sort();
  const counts = {}; periods.forEach(p => counts[p] = sv.records.filter(r=>r.period===p).length);

  // segment filter applied first
  const segFiltered = sel.seg.length
    ? sv.records.filter(r => (r.seg||[]).some(t => sel.seg.includes(t)))
    : sv.records;

  const curRecs = segFiltered.filter(r => sel.cur.includes(r.period));
  const cmpRecs = segFiltered.filter(r => sel.cmp.includes(r.period));
  const nTotal = segFiltered.length, nCur = curRecs.length, nCmp = cmpRecs.length;
  const delta = nCmp ? Math.round((nCur-nCmp)/nCmp*1000)/10 : null;

  let html = "";

  // filters
  html += `<div class="filters">`;
  html += `<div class="filter-block"><div class="flabel">${tr('filter_current_period',lang)}</div><div class="chip-row" id="chipsCur"></div></div>`;
  html += `<div class="filter-block"><div class="flabel">${tr('filter_compare_period',lang)}</div><div class="chip-row" id="chipsCmp"></div></div>`;
  if (sv.segment){
    html += `<div class="filter-block"><div class="flabel">${L(sv.segment.label,lang)}</div><div class="chip-row" id="chipsSeg"></div></div>`;
  }
  html += `</div>`;

  // KPIs
  const deltaStr = delta===null ? "—" : (delta>0?"+":"")+delta;
  const deltaCls = delta===null ? "" : (delta>=0 ? "good" : "flag");
  html += `<div class="kpi-row">
    <div class="kpi-card"><div class="klabel">${tr('kpi_total',lang)}</div><div class="kvalue">${nTotal}</div><div class="kfoot">${tr('kpi_total_foot',lang)}</div></div>
    <div class="kpi-card"><div class="klabel">${tr('kpi_current',lang)}</div><div class="kvalue">${nCur}</div><div class="kfoot">${sel.cur.map(p=>fmtPeriod(p,lang)).join(", ")||tr('period_not_selected',lang)}</div></div>
    <div class="kpi-card compare"><div class="klabel">${tr('kpi_compare',lang)}</div><div class="kvalue">${nCmp}</div><div class="kfoot">${sel.cmp.map(p=>fmtPeriod(p,lang)).join(", ")||tr('period_not_selected',lang)}</div></div>
    <div class="kpi-card ${deltaCls}"><div class="klabel">${tr('kpi_delta',lang)}</div><div class="kvalue">${deltaStr}${delta!==null?'<small>%</small>':''}</div><div class="kfoot">${tr('kpi_delta_foot',lang)}</div></div>
  </div>`;
  html += `<div><span class="legend-pill"><span class="sw" style="background:var(--current)"></span>${tr('legend_current',lang)}</span>
                <span class="legend-pill"><span class="sw" style="background:var(--compare)"></span>${tr('legend_compare',lang)}</span></div>`;

  // trend
  html += `<div class="sec-head"><span class="bar"></span><h2>${tr('sec_trend_title',lang)}</h2></div>
           <div class="sec-note">${tr('sec_trend_note',lang)}</div>`;
  const monthly = periods.map(p => segFiltered.filter(r=>r.period===p).length);
  const colors = periods.map(p => sel.cur.includes(p) ? "var(--current)" : (sel.cmp.includes(p) ? "var(--compare)" : "var(--muted)"));
  html += `<div class="card">${trendBarSVG(periods, monthly, colors, lang)}</div>`;

  // questions
  html += `<div class="sec-head"><span class="bar"></span><h2>${tr('sec_questions_title',lang)}</h2></div>
           <div class="sec-note">${tr('sec_questions_note',lang)}</div>`;
  html += `<div class="q-grid">`;
  sv.questions.forEach((q, qi) => {
    let cats, curVals, cmpVals, curN, cmpN;
    if (q.kind === "numeric15"){
      const curS = curRecs.map(r=>r[q.id]).filter(v=>v!==null && v!==undefined);
      const cmpS = cmpRecs.map(r=>r[q.id]).filter(v=>v!==null && v!==undefined);
      cats = ["1","2","3","4","5"];
      curVals = [1,2,3,4,5].map(k => curS.length ? Math.round(curS.filter(v=>v===k).length/curS.length*1000)/10 : 0);
      cmpVals = [1,2,3,4,5].map(k => cmpS.length ? Math.round(cmpS.filter(v=>v===k).length/cmpS.length*1000)/10 : 0);
      curN = curS.length; cmpN = cmpS.length;
    } else {
      const curS = curRecs.map(r=>r[q.id]).filter(Boolean);
      const cmpS = cmpRecs.map(r=>r[q.id]).filter(Boolean);
      cats = q.categories.map(c => L(DATA.catLabels[c], lang));
      curVals = q.categories.map(c => curS.length ? Math.round(curS.filter(v=>v===c).length/curS.length*1000)/10 : 0);
      cmpVals = q.categories.map(c => cmpS.length ? Math.round(cmpS.filter(v=>v===c).length/cmpS.length*1000)/10 : 0);
      curN = curS.length; cmpN = cmpS.length;
    }
    html += `<div class="card q-card" data-qi="${qi}">
      <h3>${L(q.label,lang)}</h3>
      <div class="chart-holder" data-qi="${qi}"></div>
      <div class="q-caption">${tr('answered_caption',lang,{cur:curN,cmp:cmpN})}</div>
    </div>`;
  });
  html += `</div>`;

  // comments
  html += `<div class="sec-head"><span class="bar"></span><h2>${tr('sec_comments_title',lang)}</h2></div>
           <div class="sec-note">${tr('sec_comments_note',lang)}</div>
           <div class="lang-note">${tr('comments_language_note',lang)}</div>`;
  const curComments = curRecs.flatMap(r => r.comments || []);
  const cmpComments = cmpRecs.flatMap(r => r.comments || []);
  const sentShare = (arr, k) => arr.length ? Math.round(arr.filter(c=>c.sentiment===k).length/arr.length*1000)/10 : 0;
  const curSent = { pos: sentShare(curComments,"pos"), neu: sentShare(curComments,"neu"), neg: sentShare(curComments,"neg") };
  const cmpSent = { pos: sentShare(cmpComments,"pos"), neu: sentShare(cmpComments,"neu"), neg: sentShare(cmpComments,"neg") };

  html += `<div class="comments-grid">`;
  html += `<div class="card"><h3 style="font-size:14px;font-weight:700;margin-bottom:6px;">${tr('sentiment_title',lang)}</h3>
    <div class="q-caption" style="margin:0 0 8px;">${tr('sentiment_caption',lang,{cur:curComments.length,cmp:cmpComments.length})}</div>
    <div id="sentChart"></div></div>`;

  const buckets = { pos: curComments.filter(c=>c.sentiment==="pos"), neg: curComments.filter(c=>c.sentiment==="neg"), neu: curComments.filter(c=>c.sentiment==="neu") };
  html += `<div>
    <h3 style="font-size:14px;font-weight:700;margin-bottom:2px;">${tr('comments_current_title',lang)}</h3>
    <div class="sent-tabs" id="sentTabs">
      <button class="sent-tab ${state.sentTab[key]==='pos'?'active':''}" data-k="pos">${tr('tab_positive',lang)} (${buckets.pos.length})</button>
      <button class="sent-tab ${state.sentTab[key]==='neg'?'active':''}" data-k="neg">${tr('tab_negative',lang)} (${buckets.neg.length})</button>
      <button class="sent-tab ${state.sentTab[key]==='neu'?'active':''}" data-k="neu">${tr('tab_neutral',lang)} (${buckets.neu.length})</button>
    </div>
    <div id="quoteList"></div>
  </div>`;
  html += `</div>`;

  root.innerHTML = html;

  // wire chips
  const chipsCur = document.getElementById("chipsCur");
  chipsCur.innerHTML = periods.map(p => `<span class="chip ${sel.cur.includes(p)?'sel-cur':''}" data-p="${p}">${fmtPeriod(p,lang)}</span>`).join("");
  chipsCur.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => { toggle(sel.cur, c.dataset.p); renderSurvey(); }));

  const chipsCmp = document.getElementById("chipsCmp");
  chipsCmp.innerHTML = periods.map(p => `<span class="chip ${sel.cmp.includes(p)?'sel-cmp':''}" data-p="${p}">${fmtPeriod(p,lang)}</span>`).join("");
  chipsCmp.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => { toggle(sel.cmp, c.dataset.p); renderSurvey(); }));

  if (sv.segment){
    const chipsSeg = document.getElementById("chipsSeg");
    chipsSeg.innerHTML = sv.segment.options.map(o => `<span class="chip ${sel.seg.includes(o)?'sel-seg':''}" data-o="${o}">${o}</span>`).join("");
    chipsSeg.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => { toggle(sel.seg, c.dataset.o); renderSurvey(); }));
  }

  // render question charts
  sv.questions.forEach((q, qi) => {
    let cats, curVals, cmpVals;
    if (q.kind === "numeric15"){
      const curS = curRecs.map(r=>r[q.id]).filter(v=>v!==null && v!==undefined);
      const cmpS = cmpRecs.map(r=>r[q.id]).filter(v=>v!==null && v!==undefined);
      cats = ["1","2","3","4","5"];
      curVals = [1,2,3,4,5].map(k => curS.length ? Math.round(curS.filter(v=>v===k).length/curS.length*1000)/10 : 0);
      cmpVals = [1,2,3,4,5].map(k => cmpS.length ? Math.round(cmpS.filter(v=>v===k).length/cmpS.length*1000)/10 : 0);
    } else {
      const curS = curRecs.map(r=>r[q.id]).filter(Boolean);
      const cmpS = cmpRecs.map(r=>r[q.id]).filter(Boolean);
      cats = q.categories.map(c => L(DATA.catLabels[c], lang));
      curVals = q.categories.map(c => curS.length ? Math.round(curS.filter(v=>v===c).length/curS.length*1000)/10 : 0);
      cmpVals = q.categories.map(c => cmpS.length ? Math.round(cmpS.filter(v=>v===c).length/cmpS.length*1000)/10 : 0);
    }
    const holder = document.querySelector(`.chart-holder[data-qi="${qi}"]`);
    holder.innerHTML = groupedBarSVG(cats, curVals, cmpVals, {width:440,height:190});
    wireBarTooltips(holder, cats, curVals, cmpVals, tr('legend_current',lang), tr('legend_compare',lang));
  });

  // sentiment chart
  const sentCats = [tr('sent_pos',lang), tr('sent_neu',lang), tr('sent_neg',lang)];
  const sentCurVals = [curSent.pos, curSent.neu, curSent.neg];
  const sentCmpVals = [cmpSent.pos, cmpSent.neu, cmpSent.neg];
  const sentHolder = document.getElementById("sentChart");
  sentHolder.innerHTML = groupedBarSVG(sentCats, sentCurVals, sentCmpVals, {width:340,height:190});
  wireBarTooltips(sentHolder, sentCats, sentCurVals, sentCmpVals, tr('legend_current',lang), tr('legend_compare',lang));

  // sentiment tabs -> quote list
  function renderQuotes(){
    const list = document.getElementById("quoteList");
    const sample = buckets[state.sentTab[key]].slice(0,8);
    if (!sample.length){
      list.innerHTML = `<div class="empty-note">${tr('no_comments',lang)}</div>`;
      return;
    }
    const cls = state.sentTab[key]==="pos" ? "pos" : (state.sentTab[key]==="neg" ? "neg" : "");
    list.innerHTML = sample.map(c => `<div class="quote-card ${cls}"></div>`).join("");
    list.querySelectorAll(".quote-card").forEach((el,i) => { el.textContent = sample[i].text; });
  }
  document.getElementById("sentTabs").querySelectorAll(".sent-tab").forEach(b => {
    b.addEventListener("click", () => {
      state.sentTab[key] = b.dataset.k;
      document.querySelectorAll(".sent-tab").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
      renderQuotes();
    });
  });
  renderQuotes();
}

function renderAll(){
  renderLangRow();
  renderHero();
  renderTabs();
  renderSurvey();
}
renderAll();
</script>
